<!DOCTYPE html>
<html lang="zh-MY">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交成功 - Tadika Misali</title>
    
    <!-- 核心代码：5秒后自动跳转回 index.html -->
    <meta http-equiv="refresh" content="5;url=index.html">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #FFFDF9;
            color: #5D4037;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            border-top: 8px solid;
            border-image: linear-gradient(to right, #FFB3BA, #FFDFBA, #FFFFBA, #BAFFC9, #BAE1FF, #E6B3FF) 1;
            text-align: center;
        }
        .success-card {
            background: white;
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 179, 114, 0.2);
            max-width: 500px;
            border-top: 6px solid #FFDFBA;
        }
        h1 {
            color: #D35400;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 20px;
        }
        .countdown {
            font-size: 0.9rem;
            color: #999;
            margin-top: 30px;
        }
        .btn-back {
            display: inline-block;
            background-color: #D35400;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-back:hover {
            background-color: #ba4a00;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(211, 84, 0, 0.2);
        }
    </style>
</head>
<body>

    <div class="success-card">
        <h1 style="font-size: 4rem; margin: 0;">✅</h1>
        <h1>预约提交成功！</h1>
        <p>感谢您的预约，院长将会在近期内通过电话或 WhatsApp 与您联系。</p>
        
        <a href="index.html" class="btn-back">立即返回主页</a>
        
        <div class="countdown">
            页面将在 <span id="timer">5</span> 秒后自动返回...
        </div>
    </div>

    <!-- 这是一个简单的倒数计时器动画 -->
    <script>
        let timeLeft = 5;
        const timerElement = document.getElementById('timer');
        setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                timerElement.textContent = timeLeft;
            }
        }, 1000);
    </script>
</body>
</html>
